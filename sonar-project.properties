# === Project identification ===
sonar.projectKey=hoan17122003_SocialApp
sonar.organization=hoan17122003
sonar.projectName=SocialTech
sonar.projectVersion=1.0
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# === Multi-module configuration ===
sonar.modules=SocialFrontend,SocialBackEnd

# === Global exclusions (apply to both modules) ===
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/bin/**,**/obj/**,**/*.min.js,**/*.map
sonar.test.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=**/test/**,**/tests/**,**/*.spec.ts,**/*.test.ts,**/Program.cs,**/Startup.cs

# ============================================================
# Module 1: SocialFrontend (Next.js + TypeScript)
# ============================================================
SocialFrontend.sonar.projectBaseDir=SocialFrontend
SocialFrontend.sonar.sources=src
SocialFrontend.sonar.tests=src/__tests__,src/**/*.test.ts,src/**/*.spec.ts
SocialFrontend.sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/*.config.ts,**/*.config.mjs
SocialFrontend.sonar.coverage.exclusions=**/*.config.ts,**/*.config.mjs,**/next-env.d.ts
SocialFrontend.sonar.javascript.lcov.reportPaths=coverage/lcov.info
SocialFrontend.sonar.typescript.lcov.reportPaths=coverage/lcov.info
SocialFrontend.sonar.typescript.tsconfigPath=tsconfig.json

# ============================================================
# Module 2: SocialBackEnd (.NET / C#)
# ============================================================
# Backend nằm trong SocialBackEndW/SocialBackEnd
sonar.sources=SocialBackEndW/SocialBackEnd
sonar.exclusions=**/bin/**,**/obj/**,**/Migrations/**,**/appsettings*.json,**/docker-compose*.yml,**/.env*,**/wwwroot/**,**/minio-data/**
sonar.coverage.exclusions=**/Migrations/**,**/Program.cs,**/Properties/**
sonar.cs.file.suffixes=.cs