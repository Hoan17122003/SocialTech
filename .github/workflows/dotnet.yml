# .github/workflows/dotnet.yml
# CI cho dự án .NET với build và test tách riêng

name: .NET CI

on:
  push:
    branches: [ "main", "develop", "test-ga" ]
  pull_request:
    branches: [ "main", "develop", "test-ga" ]

jobs:
  build:
    if: github.ref != 'refs/heads/test-ga'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

  test:
    if: github.ref == 'refs/heads/test-ga'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal
