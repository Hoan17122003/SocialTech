version: "3.8"

services:
  # Docker Desktop (Windows/Mac) chạy mọi container trong 1 VM Linux dùng chung.
  # vm.max_map_count là kernel param của VM đó, không set được từ Windows,
  # nên phải set qua 1 container privileged mỗi lần "docker compose up".
  # Service này chạy, set xong rồi thoát; es01/02/03 và Cassandra chờ nó
  # chạy xong (condition: service_completed_successfully) trước khi khởi động.
  sysctl-init:
    image: busybox
    privileged: true
    command: sysctl -w vm.max_map_count=1048575

  mysqlhost:
    image: mysql:8.0.45
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - SocialNetwork
    env_file:
      - .env.prod
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    image: redis:7.0.11
    restart: on-failure
    ports:
      - "6379:6379"
    networks:
      - SocialNetwork
    deploy:
      resources:
        limits:
          memory: 256m

  kafka:
    image: apache/kafka:3.9.0
    container_name: socialtech-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - SocialNetwork
    deploy:
      resources:
        limits:
          memory: 1g

  debezium:
    image: debezium/connect:2.4
    container_name: debezium_connect
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - mysqlhost
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: ${CONFIG_STORAGE_TOPIC}
      OFFSET_STORAGE_TOPIC: ${OFFSET_STORAGE_TOPIC}
      STATUS_STORAGE_TOPIC: ${STATUS_STORAGE_TOPIC}
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    env_file:
      - .env.prod
    networks:
      - SocialNetwork
    deploy:
      resources:
        limits:
          memory: 1g

  debezium-ui:
    image: debezium/debezium-ui:2.4
    container_name: debezium_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CONNECT_URIS: http://debezium:8083
    depends_on:
      - debezium
    networks:
      - SocialNetwork

  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.0
    container_name: kafdrop
    ports:
      - "9004:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
    depends_on:
      - kafka
    networks:
      - SocialNetwork

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - ${Minio_Location}:/data
    command: server /data --console-address ":9001"
    env_file:
      - .env.prod
    networks:
      - SocialNetwork

  ChatNodeVNArea:
    image: cassandra:latest
    container_name: cassandra1
    # restart: unless-stopped
    depends_on:
      sysctl-init:
        condition: service_completed_successfully
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=ChatVNCluster
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    networks:
      - cassandra-net
      - SocialNetwork
    deploy:
      resources:
        limits:
          memory: 1g

  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    depends_on:
      sysctl-init:
        condition: service_completed_successfully
    environment:
      - node.name=es01
      - cluster.name=es-docker-cluster
      - discovery.seed_hosts=es02,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_resolver.timeout=30s
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - ${ES_PORT}:9200
    volumes:
      - es01-data:/usr/share/elasticsearch/data
    networks:
      - SocialNetwork
    deploy:
      resources:
        limits:
          memory: 1g

  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    depends_on:
      sysctl-init:
        condition: service_completed_successfully
    environment:
      - node.name=es02
      - cluster.name=es-docker-cluster
      - discovery.seed_hosts=es01,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_resolver.timeout=30s
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es02-data:/usr/share/elasticsearch/data
    networks:
      - SocialNetwork
    deploy:
      resources:
        limits:
          memory: 1g

  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    depends_on:
      sysctl-init:
        condition: service_completed_successfully
    environment:
      - node.name=es03
      - cluster.name=es-docker-cluster
      - discovery.seed_hosts=es01,es02
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_resolver.timeout=30s
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es03-data:/usr/share/elasticsearch/data
    networks:
      - SocialNetwork
    deploy:
      resources:
        limits:
          memory: 1g
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: StrongPassword123
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: Admin@123
      KC_HOSTNAME: auth.yourdomain.com
    command:
      - start
    networks:
      - SocialNetwork

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    environment:
      - ELASTICSEARCH_HOSTS=http://es01:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
    ports:
      - "5601:5601"
    depends_on:
      - es01
    networks:
      - SocialNetwork

volumes:
  mysql-data:
  es01-data:
  es02-data:
  es03-data:

networks:
  SocialNetwork:
    driver: bridge
  cassandra-net:
    driver: bridge
